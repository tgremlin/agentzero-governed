name: e2e-governance

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Run E2E Stack
        run: |
          chmod +x tools/e2e.sh
          tools/e2e.sh

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color > e2e-compose.log || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: e2e-compose.log
