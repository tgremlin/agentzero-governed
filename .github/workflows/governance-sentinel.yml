name: Governance Sentinel

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  governance-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.dev.txt

      - name: Run governance sentinel
        run: python3 tools/governance_sentinel.py

      - name: Run governance test subset
        run: PYTHONPATH=. pytest -q tests/test_governance_input.py tests/test_snapshot_schema_v1.py
