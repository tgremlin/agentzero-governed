name: release-bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 0.1.0)"
        required: true
        type: string

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app container
        run: docker compose -f docker-compose.client.yml up -d --build app

      - name: Run governed release preflight gate
        run: |
          chmod +x tools/governance_release_preflight.sh
          PROJECT_NAME=governance-release tools/governance_release_preflight.sh

      - name: Build release bundle in app container
        run: |
          docker compose -f docker-compose.client.yml exec -T app /bin/bash -lc \
            "cd /a0 && ./tools/package_release.sh --version '${{ inputs.version }}'"

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-release-preflight
          path: |
            client-data/tmp/governance-preflight/eval-report.json
            client-data/tmp/governance-preflight/release-gate.json
            client-data/tmp/governance-preflight/datasets/**

      - name: Upload release bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentzero-governed-v${{ inputs.version }}
          path: |
            dist/agentzero-governed-v${{ inputs.version }}.tar.gz
            dist/agentzero-governed-v${{ inputs.version }}.sha256

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.client.yml logs --no-color > release-bundle-compose.log || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-compose-logs
          path: release-bundle-compose.log

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.client.yml down -v
