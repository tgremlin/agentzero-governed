<html>
<head>
  <title>Data Manager</title>
  <script type="module">
    import { store } from "/components/data-manager/data-manager-store.js";
  </script>
</head>
<body>
  <div
    x-data
    x-init="if ($store.dataManager && $store.dataManager.init) { $store.dataManager.init() }"
    class="data-manager-screen"
    x-show="$store.dataManager && $store.dataManager.isOpen"
  >
    <template x-if="$store.dataManager">
      <div class="data-manager-shell">
        <div class="data-manager-header">
          <div>
            <h2>Data Management</h2>
            <p>Review governance events, candidate quality, and trace datasets before export or training.</p>
          </div>
          <div class="data-manager-header-actions">
            <button class="button" @click="$store.dataManager.refresh()">Refresh</button>
            <button class="button" @click="$store.dataManager.close()">Close</button>
          </div>
        </div>

        <div class="data-manager-toolbar">
          <div class="scope-group">
            <span class="scope-label">Scope:</span>
            <button class="scope-btn" :class="{active: $store.dataManager.scope === 'global'}" @click="$store.dataManager.setScope('global')">Global</button>
            <button class="scope-btn" :class="{active: $store.dataManager.scope === 'project'}" @click="$store.dataManager.setScope('project')">Project</button>
            <button class="scope-btn" :class="{active: $store.dataManager.scope === 'chat'}" @click="$store.dataManager.setScope('chat')">Chat</button>
            <span class="scope-context" x-text="$store.dataManager.scopeContextLabel"></span>
          </div>
          <span class="scope-warning" x-show="$store.dataManager.scopeWarning" x-text="$store.dataManager.scopeWarning"></span>
        </div>

        <div class="data-manager-tabs">
          <button class="tab-btn" :class="{active: $store.dataManager.activeTab === 'governance'}" @click="$store.dataManager.setTab('governance')">Governance Events</button>
          <button class="tab-btn" :class="{active: $store.dataManager.activeTab === 'training'}" @click="$store.dataManager.setTab('training')">Training Candidates</button>
          <button class="tab-btn" :class="{active: $store.dataManager.activeTab === 'system'}" @click="$store.dataManager.setTab('system')">System Trace</button>
        </div>

        <div class="data-manager-summary-cards">
          <div class="summary-card">
            <span>Total Records</span>
            <strong x-text="$store.dataManager.total"></strong>
          </div>
          <div class="summary-card" x-show="$store.dataManager.activeTab === 'training'">
            <span>LLM Track</span>
            <strong x-text="$store.dataManager.trackCounts.llm_training"></strong>
          </div>
          <div class="summary-card" x-show="$store.dataManager.activeTab === 'training'">
            <span>Agent Tooling Track</span>
            <strong x-text="$store.dataManager.trackCounts.agent_tooling"></strong>
          </div>
          <div class="summary-card" x-show="$store.dataManager.activeTab === 'training'">
            <span>Harness Track</span>
            <strong x-text="$store.dataManager.trackCounts.harness_improvement"></strong>
          </div>
          <div class="summary-card" x-show="$store.dataManager.activeTab === 'system'">
            <span>Datasets Exported</span>
            <strong x-text="$store.dataManager.summary?.counts?.dataset_exports || 0"></strong>
          </div>
          <div class="summary-card" x-show="$store.dataManager.activeTab === 'system'">
            <span>Total Gold</span>
            <strong x-text="$store.dataManager.summary?.dataset_summary?.total_gold || 0"></strong>
          </div>
        </div>

        <div class="coming-soon-banner" x-show="$store.dataManager.comingSoon">
          <strong>Note:</strong>
          <span x-text="$store.dataManager.comingSoonMessage || 'Additional datasets are being wired.'"></span>
        </div>

        <div class="filters-grid" x-show="$store.dataManager.activeTab !== 'system'">
          <input type="text" placeholder="Search payload" x-model="$store.dataManager.filters.q" />
          <input type="text" placeholder="Event type" x-model="$store.dataManager.filters.event_type" />
          <input type="text" placeholder="Status" x-model="$store.dataManager.filters.status" />
          <input type="text" placeholder="Run ID" x-model="$store.dataManager.filters.run_id" />
          <input type="text" placeholder="From ISO time" x-model="$store.dataManager.filters.from_ts" />
          <input type="text" placeholder="To ISO time" x-model="$store.dataManager.filters.to_ts" />
          <input type="text" placeholder="Candidate track" x-show="$store.dataManager.activeTab === 'training'" x-model="$store.dataManager.filters.candidate_track" />
          <input type="text" placeholder="Consent scope" x-show="$store.dataManager.activeTab === 'training'" x-model="$store.dataManager.filters.consent_scope" />
        </div>

        <div class="actions-row" x-show="$store.dataManager.activeTab !== 'system'">
          <button class="button" @click="$store.dataManager.page = 1; $store.dataManager.refresh()">Apply Filters</button>
          <button class="button" @click="$store.dataManager.resetFilters()">Reset</button>
          <button class="button" @click="$store.dataManager.exportCurrent('jsonl')">Export JSONL</button>
          <button class="button" @click="$store.dataManager.exportCurrent('csv')">Export CSV</button>
        </div>

        <div class="training-actions" x-show="$store.dataManager.activeTab === 'training'">
          <input type="text" placeholder="Optional note" x-model="$store.dataManager.trainingNote" />
          <button class="button" @click="$store.dataManager.selectAllVisible()">Select Visible</button>
          <button class="button" @click="$store.dataManager.clearSelection()">Clear</button>
          <button class="button" @click="$store.dataManager.bulkUpdateTraining('mark_ready')">Mark Ready</button>
          <button class="button" @click="$store.dataManager.bulkUpdateTraining('mark_pending')">Mark Pending</button>
          <button class="button" @click="$store.dataManager.bulkUpdateTraining('exclude')">Exclude</button>
          <button class="button" @click="$store.dataManager.bulkUpdateTraining('reset')">Reset Overrides</button>
          <span class="selected-count" x-text="`Selected: ${$store.dataManager.selectedCandidateIds.length}`"></span>
        </div>

        <div class="meta-row">
          <span x-text="`Page: ${$store.dataManager.page}/${$store.dataManager.totalPages}`"></span>
          <span class="error" x-show="$store.dataManager.error" x-text="$store.dataManager.error"></span>
        </div>

        <div class="type-scaffold-grid" x-show="$store.dataManager.activeTab === 'system' && !$store.dataManager.loading">
          <template x-for="(type, idx) in $store.dataManager.availableTypes" :key="idx">
            <div class="type-scaffold-card">
              <div class="type-scaffold-title" x-text="type.label"></div>
              <div class="type-scaffold-status" x-text="type.status || 'planned'"></div>
            </div>
          </template>
        </div>

        <div class="events-table-wrap" x-show="!$store.dataManager.loading">
          <table class="table data-events-table">
            <thead>
              <tr>
                <th x-show="$store.dataManager.activeTab === 'training'">Select</th>
                <th x-text="$store.dataManager.activeTab === 'training' ? 'Candidate ID' : 'Time'"></th>
                <th x-text="$store.dataManager.activeTab === 'training' ? 'Created' : 'Type'"></th>
                <th x-text="$store.dataManager.activeTab === 'training' ? 'Training Status' : 'Status'"></th>
                <th x-text="$store.dataManager.activeTab === 'training' ? 'Score' : 'Project'"></th>
                <th>Run</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(event, idx) in $store.dataManager.items" :key="idx">
                <tr>
                  <td x-show="$store.dataManager.activeTab === 'training'">
                    <input type="checkbox" :checked="$store.dataManager.isSelected(event.candidate_id)" @change="$store.dataManager.toggleSelect(event.candidate_id)" />
                  </td>
                  <td x-text="$store.dataManager.activeTab === 'training' ? event.candidate_id || '' : (event.event_ts || event.created_at || '')"></td>
                  <td x-text="$store.dataManager.activeTab === 'training' ? (event.created_at || '') : (event.type || '')"></td>
                  <td x-text="$store.dataManager.activeTab === 'training' ? (event.training_status || '') : (event.status || '')"></td>
                  <td x-text="$store.dataManager.activeTab === 'training' ? String(event.score ?? '') : (event.project_name || '')"></td>
                  <td><code x-text="event.run_id || ''"></code></td>
                  <td>
                    <details>
                      <summary>Payload</summary>
                      <pre x-text="JSON.stringify(event, null, 2)"></pre>
                    </details>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="loading-row" x-show="$store.dataManager.loading">Loading records...</div>

        <div class="pager-row">
          <button class="button" @click="$store.dataManager.prevPage()" :disabled="$store.dataManager.page <= 1">Prev</button>
          <button class="button" @click="$store.dataManager.nextPage()" :disabled="$store.dataManager.page >= $store.dataManager.totalPages">Next</button>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
