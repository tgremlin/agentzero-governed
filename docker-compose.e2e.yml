services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentzero
      POSTGRES_USER: agentzero
      POSTGRES_PASSWORD: agentzero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentzero -d agentzero"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command:
      [
        "/opt/pyenv/versions/3.12.4/bin/python",
        "run_ui.py"
      ]
    environment:
      WEB_UI_HOST: 0.0.0.0
      WEB_UI_PORT: 5000
      DATABASE_URL: postgresql+psycopg://agentzero:agentzero@postgres:5432/agentzero
      GOV_PERSIST_BACKEND: postgres
      GOV_DUAL_WRITE: false
      GOV_TEMPORAL_ENABLED: false
      A0_SKIP_MISSING_MODULE_IMPORTS: "true"
      TOKENIZERS_PARALLELISM: false
    ports:
      - "50001:5000"
    volumes:
      - /opt/agentzero/data/usr:/a0/usr
      - /opt/agentzero/data/tmp:/a0/tmp
      - /mnt/storage/backups:/mnt/storage/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/pyenv/versions/3.12.4/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()\""]
      interval: 5s
      timeout: 5s
      retries: 30

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      PYTHONPATH: /a0
      DATABASE_URL: postgresql+psycopg://agentzero:agentzero@postgres:5432/agentzero
      GOV_PERSIST_BACKEND: postgres
    command:
      [
        "bash",
        "-lc",
        "PYTHONPATH=/a0 /opt/pyenv/versions/3.12.4/bin/pytest -q tests/test_governance_api_phase2.py tests/test_governance_temporal_signals.py tests/test_governance_persistence_db.py tests/test_governance_input.py tests/test_governance_llm_events.py tests/test_agent_misformat_guard.py tests/test_governance_user_message_events.py tests/test_governance_prompt_template_events.py tests/test_governance_dataset_builder.py && PYTHONPATH=/a0 /opt/pyenv/versions/3.12.4/bin/python tools/governance_audit_smoke.py && PYTHONPATH=/a0 /opt/pyenv/versions/3.12.4/bin/python tools/governance_audit_query_pack.py"
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
